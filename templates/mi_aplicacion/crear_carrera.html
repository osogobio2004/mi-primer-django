{% extends "base.html" %}

{% block title %}Registrar Carrera{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header titulo-menu">
        Registrar Nueva Carrera
    </div>
    <div class="card-body p-4">
        <form method="POST">
            {% csrf_token %}
            
            <div style="color: var(--color-chocolate);">
                {{ form.as_p }} 
            </div>
            
            <div class="text-center mt-4">
                <a href="{% url 'lista_carreras' %}" class="btn me-2" style="background-color: var(--color-hover);">Cancelar</a>
                <button type="submit" class="btn"> Guardar Carrera</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
